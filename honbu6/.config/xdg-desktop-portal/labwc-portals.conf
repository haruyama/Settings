# Override /usr/share/xdg-desktop-portal/labwc-portals.conf (default=wlr;*).
# xdg-desktop-portal-wlr provides only Screenshot/ScreenCast, so other
# interfaces fall through to "*". Once xdg-desktop-portal-gnome got pulled in
# (2026-10-27 upgrade), "*" picked gnome for FileChooser, which cannot show
# dialogs outside GNOME Shell -> browser upload dialogs silently never opened.
# Pin to gtk explicitly.
[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Inhibit=none
